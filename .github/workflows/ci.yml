# The SDK's checks: mypy, and its tests on Python 3.10 and 3.15, on each push and pull
# request, and before each release (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_OLDEST: python:3.10-alpine@sha256:8ca9f9d0f4df2af674092e7e9d79ce7985e783cecfe070f8ea850801b6520bf7
  PYTHON_NEWEST: python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: mypy
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: --no-deps -r requirements-dev.txt
          mypy
      - name: Tests on Python 3.10 and 3.15
        run: |
          for image in "$PYTHON_OLDEST" "$PYTHON_NEWEST"; do
            docker run --rm --network=none -v "$PWD:/repo:ro" -w /repo \
              -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=src "$image" \
              python -m unittest discover -s tests -t . || exit 1
          done
