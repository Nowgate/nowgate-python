# A tag v<version> publishes that version of nowgate to PyPI (RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: ci
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Build the wheel and the source archive
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: --no-deps -r requirements-dev.txt
          mkdir -p dist
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -c '
          import flit_core.buildapi as flit
          flit.build_wheel("dist")
          flit.build_sdist("dist")'
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
